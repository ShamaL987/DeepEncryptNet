flow_daemon:
  runtime_json_path: "app/runtime_config.json"
  db_path: "/data/runtime/flow_state.db"

  columns:
    timestamp: "timestamp"
    src_ip: "src_ip"
    src_port: "src_port"
    dst_ip: "dst_ip"
    dst_port: "dst_port"
    protocol: "protocol"

database:
  host: "YOUR_EXTERNAL_DB_HOST"
  port: 5432
  name: "flows"
  user: "YOUR_DB_USER"
  password: "YOUR_DB_PASSWORD"