services:
  deepencryptnet-local:
    image: shamal933/deepencryptnet:latest
    container_name: deepencryptnet-local
    ports:
      - "8000:8000"
      - "5432:5432"
    environment:
      APP_ENV: local
      ADMIN_BOOTSTRAP_TOKEN: WksdJhAhFTgjuqnmRZPozSmqMEC8EkaHuOEHl0Md3As
      JWT_SECRET_KEY: pOorLFNz4A5MirWucPZPzlQnCiv_02nnL6hElKBiNz6AFIZbCNbt9ZRqdrBtirZAB5pnjt6c4BFa2ECLsUhzXg
      JWT_ALGORITHM: HS256
