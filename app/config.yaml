reader:
  csv_path: "../../AIMchat2.csv"     # absolute or relative path to your capture CSV
  poll_interval_sec: 5
  max_concurrent_extractors: 5
  https_port: 443
  require_syn_for_start: true

  # column names used in your CSV
  columns:
    timestamp: "timestamp"
    src_ip: "src_ip"
    src_port: "src_port"
    dst_ip: "dst_ip"
    dst_port: "dst_port"
    protocol: "protocol"
    length: "length"
    tcp_flags: "tcp_flags"   # set to null if you don't have it
