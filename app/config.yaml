flow_daemon:
  csv_path: 'D:/FYP_DEV/AIMchat2.csv'
  poll_interval_sec: 2.0
  idle_timeout_sec: 15.0
  active_timeout_sec: 1800.0
  https_only: false
  protocol_filter: ['TCP', 'UDP']
  output_dir: 'D:/FYP_DEV/app/data/extracted'
  db_path: 'D:/FYP_DEV/app/data/flow_state.db'
  columns:
    timestamp: 'timestamp'
    src_ip: 'src_ip'
    src_port: 'src_port'
    dst_ip: 'dst_ip'
    dst_port: 'dst_port'
    protocol: 'protocol'

database:
  host: 'localhost'
  port: 5432
  name: 'flows'
  user: 'postgres'
  password: ''
