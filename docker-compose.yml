services:
  deepencryptnet:
    build: .
    container_name: deepencryptnet
    ports:
      - "8000:8000"
      # expose only if you truly want DB accessible from host
      # - "5432:5432"
    volumes:
      - ./logs:/data/logs
      - pg_data:/var/lib/postgresql/data
      - ./tracker-exe/files:/data/files
    environment:
      # App side (use 127.0.0.1 to avoid ipv6 ::1 issues)
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: flows
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

      # DB bootstrap used by entrypoint
      POSTGRES_DB: flows
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data

    restart: unless-stopped

volumes:
  pg_data:
