flow_daemon:
  runtime_json_path: "app/runtime_config.json"
  db_path: "/data/runtime/flow_state.db"

  columns:
    timestamp: "timestamp"
    src_ip: "src_ip"
    src_port: "src_port"
    dst_ip: "dst_ip"
    dst_port: "dst_port"
    protocol: "protocol"

database:
  host: "127.0.0.1"
  port: 5432
  name: "flows"
  user: "postgres"
  password: "postgres"

auth:
  jwt_algorithm: "HS256"
  jwt_access_token_expire_minutes: 6000