[supervisord]
nodaemon=true
user=root

[program:postgres]
command=/bin/bash -lc "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n1) && exec $PG_BIN/postgres -D /var/lib/postgresql/data -c listen_addresses='127.0.0.1'"
user=postgres
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:fastapi]
command=/app/.venv/bin/python -m uvicorn app.main:application --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
